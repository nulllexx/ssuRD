name: Deploy to Minecraft Server

on:
  # Push to main ships to prod: build -> backup -> scp -> restart container.
  push:
    branches: [main]
  # Manual dispatch stays for deploying any other branch/tag/SHA (requires the confirm gate).
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch (or tag/SHA) to deploy'
        required: true
        default: 'main'
      confirm:
        description: 'Type "deploy" to confirm a production deploy'
        required: true
        default: ''

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # The confirm gate only applies to manual dispatch; a push to main is itself the intent.
    - name: Validate confirmation
      if: github.event_name == 'workflow_dispatch'
      run: |
        if [ "${{ inputs.confirm }}" != "deploy" ]; then
          echo "::error::You must type 'deploy' in the confirm field to proceed."
          exit 1
        fi

    # Fail fast if AES_KEY isn't a usable AES length. Raw-bytes AES needs exactly 16/24/32 bytes;
    # this is the exact footgun behind the "Invalid AES key length: 64 bytes" outage.
    - name: Validate AES_KEY length
      env:
        AES_KEY: ${{ secrets.AES_KEY }}
      run: |
        len=$(printf '%s' "$AES_KEY" | wc -c)
        if [ "$len" -ne 16 ] && [ "$len" -ne 24 ] && [ "$len" -ne 32 ]; then
          echo "::error::AES_KEY secret must be 16, 24, or 32 bytes (AES-128/192/256); got $len. Fix the repo secret before deploying."
          exit 1
        fi
        echo "AES_KEY length OK ($len bytes)."

    - uses: actions/checkout@v4
      with:
        # Manual: the chosen branch. Push: the pushed ref (inputs.branch is empty).
        ref: ${{ inputs.branch || github.ref }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B clean package --file pom.xml

    - name: Resolve built JAR path
      id: jar
      run: |
        JAR_PATH=$(ls target/ServerUtils-*.jar | grep -v original- | head -n1)
        if [ -z "$JAR_PATH" ]; then
          echo "::error::No built JAR found in target/"
          exit 1
        fi
        echo "path=$JAR_PATH" >> "$GITHUB_OUTPUT"
        echo "name=$(basename $JAR_PATH)" >> "$GITHUB_OUTPUT"

    - name: Back up existing plugin JAR on server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 2222
        script: |
          set -e
          PLUGINS=/home/useradmin/mcserver/plugins
          BACKUPS=/home/useradmin/mcserver/plugins/_backups
          mkdir -p "$BACKUPS"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          for f in "$PLUGINS"/ServerUtils-*.jar; do
            [ -e "$f" ] || continue
            cp -v "$f" "$BACKUPS/$(basename "$f").$TS.bak"
          done
          ls -t "$BACKUPS" | tail -n +11 | xargs -I {} rm -f -- "$BACKUPS/{}" || true

    - name: Copy JAR to remote server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 2222
        source: ${{ steps.jar.outputs.path }}
        target: /home/useradmin/mcserver/plugins/
        strip_components: 1

    # The scp above only ADDS a file. Until the version in pom.xml changed, every deploy happened to
    # reuse the same filename and overwrote in place; the first version bump left two ServerUtils
    # JARs side by side and Bukkit refused to choose ("Ambiguous plugin name"), silently loading the
    # older one. Delete every ServerUtils JAR that is not the one we just uploaded.
    - name: Remove superseded plugin JARs on server
      uses: appleboy/ssh-action@master
      env:
        JAR_NAME: ${{ steps.jar.outputs.name }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 2222
        envs: JAR_NAME
        script: |
          set -e
          PLUGINS=/home/useradmin/mcserver/plugins
          NEW="$PLUGINS/$JAR_NAME"
          # Never prune on the strength of an upload we cannot see: a failed scp must leave the
          # currently-installed plugin in place rather than empty the directory.
          if [ ! -s "$NEW" ]; then
            echo "::error::Expected $NEW after upload, but it is missing or empty. Leaving existing plugin JARs untouched."
            exit 1
          fi
          removed=0
          for f in "$PLUGINS"/ServerUtils-*.jar; do
            [ -e "$f" ] || continue
            if [ "$f" != "$NEW" ]; then
              rm -v -f -- "$f"
              removed=$((removed + 1))
            fi
          done
          echo "$JAR_NAME is now the only ServerUtils JAR in $PLUGINS (removed $removed superseded)."

    # Write the (validated) secret into the server's real .env so the plugin actually picks it up.
    # Only the AES_KEY line is touched; ADMIN_USER/ADMIN_PWD and any other entries are preserved.
    - name: Sync AES_KEY into the server .env
      uses: appleboy/ssh-action@master
      env:
        AES_KEY: ${{ secrets.AES_KEY }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 2222
        envs: AES_KEY
        script: |
          set -e
          ENV_FILE=/home/useradmin/mcserver/.env
          if [ -z "$AES_KEY" ]; then
            echo "::error::AES_KEY is empty; refusing to touch $ENV_FILE"
            exit 1
          fi
          touch "$ENV_FILE"
          tmp=$(mktemp)
          grep -v '^AES_KEY=' "$ENV_FILE" > "$tmp" || true
          printf 'AES_KEY=%s\n' "$AES_KEY" >> "$tmp"
          cat "$tmp" > "$ENV_FILE"   # write in place: keeps the file's owner/permissions
          rm -f "$tmp"
          echo "AES_KEY synced into $ENV_FILE."

    # Player inventories are only written to disk on quit, on the autosave tick (6000 ticks = 5
    # minutes by default), and on a clean shutdown. `docker compose restart` allows the default
    # 10s grace period before SIGKILL, which is not enough for a Minecraft server to finish
    # saving -- so a deploy could cost every online player up to a full autosave interval of
    # inventory progress, while world chunks (also written as they unload) survived.
    - name: Restart Minecraft container
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: 2222
        script: |
          set -e
          cd /home/useradmin/docker

          # Stop and start rather than restart, so the shutdown gets a grace period long enough
          # to flush player data and so the exit code can be inspected afterwards.
          docker compose stop -t 120 minecraft

          CID=$(docker compose ps -aq minecraft || true)
          CODE=""
          if [ -n "$CID" ]; then
            CODE=$(docker inspect -f '{{.State.ExitCode}}' "$CID" 2>/dev/null || true)
          fi
          # 137 = SIGKILL: the grace period expired, so the server did not save on the way out.
          if [ "$CODE" = "137" ]; then
            echo "::warning::Minecraft was SIGKILLed (exit 137) despite a 120s grace period, so"
            echo "::warning::player inventories were NOT saved on shutdown. Check that the image"
            echo "::warning::traps SIGTERM and issues the server 'stop' command."
          elif [ -z "$CODE" ]; then
            echo "Could not read Minecraft's exit code; unable to confirm it shut down cleanly."
          else
            echo "Minecraft exited cleanly (exit code $CODE); player data was flushed."
          fi

          docker compose start minecraft

    - name: Summary
      run: |
        echo "Deployed ${{ steps.jar.outputs.name }} from ref '${{ inputs.branch || github.ref_name }}'." >> "$GITHUB_STEP_SUMMARY"
        echo "AES_KEY (from the repo secret) synced into /home/useradmin/mcserver/.env and the container restarted." >> "$GITHUB_STEP_SUMMARY"
        echo "Previous JAR backed up under /home/useradmin/mcserver/plugins/_backups/ on the server." >> "$GITHUB_STEP_SUMMARY"
